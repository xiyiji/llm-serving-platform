# LLM Serving Platform — gateway configuration.
# Every value can be overridden with LSP_* environment variables (see app/config.py).
host: 0.0.0.0
port: 8000
default_model: llama-3.1-8b-instruct
default_backend: primary
routing_strategy: adaptive        # round_robin | latency | adaptive

warm_pool_capacity: 4
warm_pool_eviction: lru           # lru | lfu | ttl
cold_start_load_s: 1.2

batch_enabled: true
batch_window_ms: 8
batch_max_size: 8

kv_cache_enabled: true
kv_cache_capacity: 512

backends:
  # Default: a simulated engine, so the whole platform runs with no GPU or key.
  - name: primary
    kind: simulated
    models: [llama-3.1-8b-instruct, mistral-7b-instruct]
  # Point at any OpenAI-compatible server (vLLM, TGI, Ollama, llama.cpp, hosted APIs):
  # - name: vllm
  #   kind: openai_compat
  #   base_url: http://localhost:8001/v1
  #   api_key: null
  #   models: [llama-3.1-8b-instruct]
