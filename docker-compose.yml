services:
  gateway:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      LSP_LOG_LEVEL: INFO
      # Point at a real OpenAI-compatible engine (vLLM / TGI / Ollama) like so:
      # LSP_UPSTREAM_BASE_URL: http://vllm:8001/v1
      # LSP_UPSTREAM_MODELS: llama-3.1-8b-instruct
    restart: unless-stopped

  console:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [gateway]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/dashboard.json:/var/lib/grafana/dashboards/gateway.json:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]
